<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>朝からそれ〇〇</title>

    <link rel="stylesheet" href="./hostDisplay.css" />
    <script src="./hostDisplay.js" defer></script>
  </head>
  <body class="all">
    <header>
      <div class="header_logo">
        <img src="../logo/logo_ver1.svg" class="header_morning_logo" />
        <img src="../logo/logo_ver2.svg" class="header_night_logo" />
      </div>
      <button id="back_btn">戻る</button>
    </header>
    <div class="action">
      <input type="number" id="player" placeholder="人数" />
      <input type="number" id="count" placeholder="制限時間(秒)" />
      <input type="number" id="roomName" placeholder="部屋名" />
      <button id="in_room">部屋を作成</button>
    </div>
  </body>
</html>
